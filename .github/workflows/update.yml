name: Actualizar indicadores piso BTC

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar recolector
        run: python scripts/update_indicadores.py

      - name: Commit de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "chore: actualizar indicadores ($(date -u +%Y-%m-%d))"
            git push
          fi
